<body class="min-h-screen flex flex-col items-center overflow-x-hidden">
  <div id="app" class="w-full max-w-md min-h-screen bg-slate-950 flex flex-col overflow-x-hidden shadow-2xl border-x border-slate-800/60"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, doc, setDoc, getDocs, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCusF7yV1Kcycx78cIg_8D_9XzX50Tha3Q",
      authDomain: "porra-laliga-26771.firebaseapp.com",
      projectId: "porra-laliga-26771",
      storageBucket: "porra-laliga-26771.firebasestorage.app",
      messagingSenderId: "471237266974",
      appId: "1:471237266974:web:fe218de9ac5c9f5b3c680f"
    };

    let db = null;
    try {
      const fbApp = initializeApp(firebaseConfig);
      db = getFirestore(fbApp);
    } catch (err) {
      console.error("Error iniciando Firebase:", err);
    }

    const FALLBACK_MATCHES = [
      { id: "m1", jornada: 15, home: "Real Madrid", away: "Getafe", date: "2026-12-05T16:15:00Z", status: "FINISHED", homeGoals: 2, awayGoals: 0 },
      { id: "m2", jornada: 15, home: "Barcelona", away: "Betis", date: "2026-12-05T18:30:00Z", status: "FINISHED", homeGoals: 3, awayGoals: 1 },
      { id: "m3", jornada: 15, home: "At. Madrid", away: "Sevilla", date: "2026-12-05T21:00:00Z", status: "IN_PLAY", homeGoals: 1, awayGoals: 1 },
      { id: "m4", jornada: 15, home: "Valencia", away: "Athletic", date: "2026-12-06T14:00:00Z", status: "SCHEDULED", homeGoals: null, awayGoals: null },
      { id: "m5", jornada: 15, home: "R. Sociedad", away: "Villarreal", date: "2026-12-06T16:15:00Z", status: "SCHEDULED", homeGoals: null, awayGoals: null }
    ];

    const FALLBACK_PAST_ROUNDS = [
      {
        jornada: 14,
        bonusAwarded: { "Carlos": 5, "Lucía": 0, "Mateo": 0 },
        rows: [
          { user: "Carlos", pts: 18, exactos: 3 },
          { user: "Lucía", pts: 15, exactos: 2 },
          { user: "Mateo", pts: 12, exactos: 1 }
        ]
      }
    ];

    const state = {
      screen: "auth",
      authMode: null,
      currentUser: null,
      activeTab: "next",
      currentSubTab: "real",
      users: [],
      predictions: {},
      matches: FALLBACK_MATCHES,
      currentJornada: 15,
      nextJornada: 16,
      pastRounds: FALLBACK_PAST_ROUNDS,
      liveModeStatus: "AUTO",
      toast: ""
    };

    function showToast(msg) {
      state.toast = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2600);
    }

    function getSign(h, a) {
      if (h === null || a === null || h === "" || a === "" || isNaN(h) || isNaN(a)) return null;
      const nh = Number(h), na = Number(a);
      if (nh > na) return "1";
      if (nh < na) return "2";
      return "X";
    }

    function scoreMatch(predH, predA, realH, realA) {
      if (
        predH === null || predA === null || predH === "" || predA === "" ||
        realH === null || realA === null || realH === "" || realA === ""
      ) {
        return { pts: 0, exact: false };
      }
      const ph = Number(predH), pa = Number(predA);
      const rh = Number(realH), ra = Number(realA);
      if (ph === rh && pa === ra) {
        return { pts: 4, exact: true };
      }
      const pSign = getSign(ph, pa);
      const rSign = getSign(rh, ra);
      if (pSign && pSign === rSign) {
        const diffBonus = ((ph - pa) === (rh - ra)) ? 1 : 0;
        return { pts: 2 + diffBonus, exact: false };
      }
      return { pts: 0, exact: false };
    }

    function isRoundLocked(roundMatches) {
      if (state.liveModeStatus === "LOCKED") return true;
      if (state.liveModeStatus === "OPEN") return false;
      return roundMatches.some(m => m.status === "IN_PLAY" || m.status === "PAUSED" || m.status === "FINISHED");
    }

    function computeCurrentJornadaStandings() {
      const jornadaMatches = state.matches.filter(m => m.jornada === state.currentJornada);
      const base = state.users.map(u => {
        let pts = 0;
        let exactos = 0;
        jornadaMatches.forEach(m => {
          const p = state.predictions[`${u.name}_${m.id}`];
          if (p) {
            const res = scoreMatch(p.h, p.a, m.homeGoals, m.awayGoals);
            pts += res.pts;
            if (res.exact) exactos += 1;
          }
        });
        return { user: u.name, pts, exactos, bonus: 0, isWinner: false, isTiedBonus: false };
      });

      base.sort((a, b) => (b.pts - a.pts) || (b.exactos - a.exactos) || a.user.localeCompare(b.user));

      if (base.length > 0 && base[0].pts > 0) {
        const topPts = base[0].pts;
        const topExact = base[0].exactos;
        const exactTied = base.filter(x => x.pts === topPts && x.exactos === topExact);
        if (exactTied.length === 1) {
          base[0].bonus = 5;
          base[0].isWinner = true;
        } else {
          exactTied.forEach(item => {
            item.bonus = 3;
            item.isTiedBonus = true;
          });
        }
      }
      return base;
    }

    function computeGeneralStandings() {
      const currentStand = computeCurrentJornadaStandings();
      const currentMap = Object.fromEntries(currentStand.map(r => [r.user, r]));

      const list = state.users.map(u => {
        const basePts = Number(u.basePoints || 0);
        const baseWins = Number(u.baseWins || 0);
        const baseExact = Number(u.baseExact || 0);
        const cur = currentMap[u.name] || { pts: 0, exactos: 0, bonus: 0, isWinner: false, isTiedBonus: false };

        const totalPts = basePts + cur.pts + cur.bonus;
        const totalWins = baseWins + ((cur.isWinner || cur.isTiedBonus) ? 1 : 0);
        const totalExact = baseExact + cur.exactos;

        return {
          name: u.name,
          pts: totalPts,
          wins: totalWins,
          exactos: totalExact
        };
      });

      list.sort((a, b) => (b.pts - a.pts) || (b.wins - a.wins) || (b.exactos - a.exactos) || a.name.localeCompare(b.name));
      return list;
    }

    async function loadMatchesFromApi() {
      try {
        const res = await fetch("/api/laliga");
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data.matches) && data.matches.length > 0) {
          const parsed = data.matches.map(m => ({
            id: String(m.id),
            jornada: Number(m.matchday || 1),
            home: m.homeTeam?.shortName || m.homeTeam?.name || "Local",
            away: m.awayTeam?.shortName || m.awayTeam?.name || "Visitante",
            date: m.utcDate,
            status: m.status,
            homeGoals: m.score?.fullTime?.home ?? null,
            awayGoals: m.score?.fullTime?.away ?? null
          }));
          state.matches = parsed;
          const activeMatch = parsed.find(m => m.status === "IN_PLAY" || m.status === "PAUSED")
            || parsed.filter(m => m.status === "FINISHED").slice(-1)[0]
            || parsed[0];
          const curJ = activeMatch ? activeMatch.jornada : 1;
          state.currentJornada = curJ;
          state.nextJornada = curJ + 1;
          render();
        }
      } catch (_) {}
    }

    function subscribeFirestore() {
      if (!db) return;
      try {
        onSnapshot(collection(db, "users"), (snap) => {
          const arr = [];
          snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
          state.users = arr;
          render();
        }, (err) => console.warn("Firestore users:", err));

        onSnapshot(collection(db, "predictions"), (snap) => {
          const map = {};
          snap.forEach(d => { map[d.id] = d.data(); });
          state.predictions = map;
          render();
        }, (err) => console.warn("Firestore predictions:", err));
      } catch (err) {
        console.warn("Error suscribiendo Firestore:", err);
      }
    }

    async function handleRegister(name, pin) {
      const cleanName = name.trim();
      const cleanPin = pin.trim();
      if (!cleanName || cleanPin.length < 4) {
        showToast("Pon un nombre y un PIN de al menos 4 dígitos");
        return;
      }
      const exists = state.users.some(u => u.name.toLowerCase() === cleanName.toLowerCase());
      if (exists) {
        showToast("Ese nombre ya está registrado. Usa Entrar");
        return;
      }

      const standings = computeGeneralStandings();
      const lastPlacePoints = standings.length > 0 ? standings[standings.length - 1].pts : 0;

      const userDoc = {
        name: cleanName,
        pin: cleanPin,
        basePoints: lastPlacePoints,
        baseWins: 0,
        baseExact: 0,
        createdAt: Date.now()
      };

      if (db) {
        try {
          await setDoc(doc(db, "users", cleanName.toLowerCase()), userDoc);
        } catch (_) {
          state.users.push(userDoc);
        }
      } else {
        state.users.push(userDoc);
      }

      state.currentUser = cleanName;
      state.screen = "home";
      state.activeTab = "next";
      showToast(`¡Bienvenido ${cleanName}! Empiezas con ${lastPlacePoints} pts`);
    }

    async function handleLogin(name, pin) {
      const cleanName = name.trim();
      const cleanPin = pin.trim();
      let found = state.users.find(u => u.name.toLowerCase() === cleanName.toLowerCase());

      if (!found && db) {
        try {
          const snap = await getDocs(collection(db, "users"));
          snap.forEach(d => {
            const data = d.data();
            if (data.name && data.name.toLowerCase() === cleanName.toLowerCase()) {
              found = data;
            }
          });
        } catch (_) {}
      }

      if (!found) {
        showToast("Usuario no encontrado. Regístrate primero");
        return;
      }
      if (found.pin && found.pin !== cleanPin) {
        showToast("PIN incorrecto");
        return;
      }

      state.currentUser = found.name;
      state.screen = "home";
      state.activeTab = "next";
      showToast(`Sesión iniciada como ${found.name}`);
    }

    async function savePredictions(roundMatches) {
      if (!state.currentUser) return;
      if (isRoundLocked(roundMatches)) {
        showToast("Jornada bloqueada: ya empezó el 1er partido");
        return;
      }

      for (const m of roundMatches) {
        const hEl = document.getElementById(`pred-h-${m.id}`);
        const aEl = document.getElementById(`pred-a-${m.id}`);
        if (!hEl || !aEl) continue;
        const hVal = hEl.value === "" ? null : Number(hEl.value);
        const aVal = aEl.value === "" ? null : Number(aEl.value);
        if (hVal !== null && aVal !== null) {
          const key = `${state.currentUser}_${m.id}`;
          const payload = { user: state.currentUser, matchId: m.id, h: hVal, a: aVal };
          state.predictions[key] = payload;
          if (db) {
            try {
              await setDoc(doc(db, "predictions", key), payload);
            } catch (_) {}
          }
        }
      }
      showToast("Pronósticos guardados");
    }

    function renderAuthScreen() {
      return `
        <div class="flex-1 flex flex-col justify-between p-5 bg-gradient-to-b from-emerald-950/60 via-slate-950 to-slate-950">
          <div class="pt-6 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/15 border border-emerald-400/30 text-3xl mb-4">
              ⚽
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">PORRA LALIGA</h1>
            <p class="text-xs text-slate-400 mt-1.5">Compite con tus amigos jornada a jornada</p>
          </div>

          <div class="my-auto space-y-3">
            ${!state.authMode ? `
              <button id="btn-go-register" class="w-full py-4 px-5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-slate-950 font-bold text-base shadow-lg shadow-emerald-950/50 transition">
                Registrarse
              </button>
              <button id="btn-go-login" class="w-full py-4 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-[0.99] text-white font-bold text-base border border-slate-700 transition">
                Entrar
              </button>
            ` : `
              <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="text-base font-bold text-white">
                    ${state.authMode === "register" ? "Crear cuenta" : "Iniciar sesión"}
                  </h2>

                  </button>
                </div>

                <div>
                  <label class="block text-xs text-slate-400 mb-1">Nombre o apodo</label>
                  <input id="auth-name" type="text" placeholder="Ej: Javier" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-400" />
                </div>

                <div>
                  <label class="block text-xs text-slate-400 mb-1">PIN (mín. 4 caracteres)</label>
                  <input id="auth-pin" type="password" placeholder="••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-400" />
                </div>

                ${state.authMode === "register" ? `
                  <p class="text-[11px] text-emerald-300/90 bg-emerald-950/50 border border-emerald-800/40 rounded-xl p-2.5">
                    Si la liga ya empezó, entrarás con los mismos puntos que el último clasificado.
                  </p>
                ` : ""}

                <button id="btn-submit-auth" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition">
                  ${state.authMode === "register" ? "Completar registro" : "Entrar a la porra"}
                </button>
              </div>
            `}
          </div>

          <div class="text-center text-[11px] text-slate-500 pb-2">
            Optimizado para móvil · Sin desplazamiento lateral
          </div>
        </div>
      `;
    }

    function renderHomeScreen() {
      const general = computeGeneralStandings();
      const myRankIndex = general.findIndex(u => u.name === state.currentUser);
      const myData = myRankIndex >= 0 ? general[myRankIndex] : { pts: 0, wins: 0, exactos: 0 };

      const menuItems = [
        { id: "next", label: "⚽ Pronósticos próxima jornada" },
        { id: "standings", label: "🏆 Clasificación" },
        { id: "current", label: "📌 Jornada actual" },
        { id: "history", label: "📜 Jornadas anteriores" },
        { id: "rules", label: "📖 Reglas del Juego" }
      ];

      return `
        <header class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3.5 py-3">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs text-emerald-400 font-semibold truncate">Hola, ${state.currentUser}</div>
              <div class="text-sm font-extrabold text-white truncate">
                ${myData.pts} pts · ${myRankIndex >= 0 ? `#${myRankIndex + 1}` : "-"}
              </div>
            </div>
            <button id="btn-logout" class="shrink-0 text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
              Salir
            </button>
          </div>

          <nav class="mt-2.5 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${menuItems.map(item => `
              <button data-tab="${item.id}" class="tab-btn shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition ${
                state.activeTab === item.id
                  ? "bg-emerald-500 text-slate-950"
                  : "bg-slate-900 text-slate-300 border border-slate-800"
              }">
                ${item.label}
              </button>
            `).join("")}
          </nav>
        </header>

        <main class="flex-1 p-3.5 space-y-3 overflow-x-hidden">
          ${renderActiveTabContent(general)}
        </main>
      `;
    }

    function renderActiveTabContent(general) {
      if (state.activeTab === "next") return renderNextJornadaTab();
      if (state.activeTab === "standings") return renderGeneralStandingsTab(general);
      if (state.activeTab === "current") return renderCurrentJornadaTab();
      if (state.activeTab === "history") return renderHistoryTab();
      return renderRulesTab();
    }

    function renderNextJornadaTab() {
      let roundMatches = state.matches.filter(m => m.jornada === state.nextJornada);
      if (roundMatches.length === 0) {
        roundMatches = FALLBACK_MATCHES.map((m, idx) => ({
          ...m,
          id: `next_${idx}`,
          jornada: state.nextJornada,
          status: "SCHEDULED",
          homeGoals: null,
          awayGoals: null
        }));
      }

      const locked = isRoundLocked(roundMatches);

      return `
        <div class="flex items-center justify-between gap-2 bg-slate-900 border border-slate-800 rounded-xl p-3">
          <div>
            <h2 class="text-sm font-bold text-white">Jornada ${state.nextJornada}</h2>
            <p class="text-[11px] ${locked ? "text-amber-400" : "text-emerald-400"}">
              ${locked ? "Bloqueada: pronósticos visibles para todos" : "Abierta: edita tus marcadores antes del 1er partido"}
            </p>
          </div>
          <span class="shrink-0 text-[11px] px-2 py-1 rounded-md font-semibold ${
            locked ? "bg-amber-500/15 text-amber-300 border border-amber-500/30" : "bg-emerald-500/15 text-emerald-300 border border-emerald-500/30"
          }">
            ${locked ? "Cerrada" : "Abierta"}
          </span>
        </div>

        <div class="space-y-2.5">
          ${roundMatches.map(m => {
            const myPred = state.predictions[`${state.currentUser}_${m.id}`] || { h: "", a: "" };
            return `
              <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-semibold text-white truncate flex-1">${m.home}</span>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <input id="pred-h-${m.id}" type="number" min="0" max="20" value="${myPred.h ?? ""}" ${locked ? "disabled" : ""}
                      class="w-10 h-8 text-center text-sm font-bold rounded-lg bg-slate-950 border border-slate-700 text-white disabled:opacity-60" />
                    <span class="text-xs text-slate-500">-</span>
                    <input id="pred-a-${m.id}" type="number" min="0" max="20" value="${myPred.a ?? ""}" ${locked ? "disabled" : ""}
                      class="w-10 h-8 text-center text-sm font-bold rounded-lg bg-slate-950 border border-slate-700 text-white disabled:opacity-60" />
                  </div>
                  <span class="text-xs font-semibold text-white truncate flex-1 text-right">${m.away}</span>
                </div>

                ${locked ? `
                  <div class="pt-2 border-t border-slate-800/80 flex flex-wrap gap-1.5">
                    ${state.users.map(u => {
                      const p = state.predictions[`${u.name}_${m.id}`];
                      const txt = (p && p.h !== null && p.a !== null) ? `${p.h}-${p.a}` : "-";
                      return `<span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-200">${u.name}: <b>${txt}</b></span>`;
                    }).join("")}
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>

        ${!locked ? `
          <button id="btn-save-preds" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition">
            Guardar pronósticos
          </button>
        ` : ""}
      `;
    }

    function renderGeneralStandingsTab(general) {
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
          <div class="px-3 py-2.5 border-b border-slate-800">
            <h2 class="text-sm font-bold text-white">Clasificación General</h2>
          </div>

          <table class="w-full table-fixed text-left border-collapse">
            <thead>
              <tr class="bg-slate-950 text-[11px] text-slate-400 border-b border-slate-800">
                <th class="py-2 pl-2.5 pr-1 w-[38%]">Jugador</th>
                <th class="py-2 px-1 text-center w-[20%]">Pts</th>
                <th class="py-2 px-1 text-center w-[21%]">J. Gan.</th>
                <th class="py-2 pl-1 pr-2.5 text-center w-[21%]">Exactos</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/70 text-xs">
              ${general.map((row, idx) => `
                <tr class="${row.name === state.currentUser ? "bg-emerald-950/30" : ""}">
                  <td class="py-2.5 pl-2.5 pr-1 font-semibold text-white truncate">
                    <span class="text-slate-400 mr-1">${idx + 1}.</span>${row.name}
                  </td>
                  <td class="py-2.5 px-1 text-center font-extrabold text-emerald-400">${row.pts}</td>
                  <td class="py-2.5 px-1 text-center text-slate-200">${row.wins}</td>
                  <td class="py-2.5 pl-1 pr-2.5 text-center text-slate-200">${row.exactos}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderCurrentJornadaTab() {
      const subTabs = [
        { id: "real", label: "Jornada real" },
        { id: "standings", label: "Clasif. jornada" },
        { id: "results", label: "Resultados" }
      ];

      return `
        <div class="grid grid-cols-3 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
          ${subTabs.map(st => `
            <button data-subtab="${st.id}" class="subtab-btn py-2 px-1.5 rounded-lg text-[11px] font-bold truncate transition ${
              state.currentSubTab === st.id
                ? "bg-emerald-500 text-slate-950"
                : "text-slate-300 hover:text-white"
            }">
              ${st.label}
            </button>
          `).join("")}
        </div>

        ${state.currentSubTab === "real" ? renderJornadaRealSubTab() : ""}
        ${state.currentSubTab === "standings" ? renderJornadaStandingsSubTab() : ""}
        ${state.currentSubTab === "results" ? renderJornadaResultsSubTab() : ""}
      `;
    }

    function renderJornadaRealSubTab() {
      const roundMatches = state.matches.filter(m => m.jornada === state.currentJornada);
      const list = roundMatches.length ? roundMatches : FALLBACK_MATCHES;

      return `
        <div class="space-y-2">
          ${list.map(m => {
            const p = state.predictions[`${state.currentUser}_${m.id}`];
            const earned = p ? scoreMatch(p.h, p.a, m.homeGoals, m.awayGoals).pts : 0;
            const scoreText = (m.homeGoals !== null && m.awayGoals !== null) ? `${m.homeGoals} - ${m.awayGoals}` : "vs";
            return `
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="text-xs font-bold text-white truncate">${m.home} - ${m.away}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">
                    Tu pronóstico: <span class="text-slate-200 font-semibold">${p ? `${p.h}-${p.a}` : "-"}</span>
                  </div>
                </div>
                <div class="shrink-0 text-right">
                  <div class="text-sm font-extrabold text-white bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                    ${scoreText}
                  </div>
                  <div class="text-[11px] text-emerald-400 font-semibold mt-0.5">+${earned} pts</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderJornadaStandingsSubTab() {
      const rows = computeCurrentJornadaStandings();
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
          <div class="px-3 py-2.5 border-b border-slate-800">
            <h3 class="text-sm font-bold text-white">Clasificación Jornada ${state.currentJornada}</h3>
          </div>
          <table class="w-full table-fixed text-left border-collapse">
            <thead>
              <tr class="bg-slate-950 text-[11px] text-slate-400 border-b border-slate-800">
                <th class="py-2 pl-2.5 pr-1 w-[46%]">Jugador</th>
                <th class="py-2 px-1 text-center w-[27%]">Pts J.</th>
                <th class="py-2 pl-1 pr-2.5 text-center w-[27%]">Exactos J.</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/70 text-xs">
              ${rows.map((r, idx) => `
                <tr class="${r.name === state.currentUser ? "bg-emerald-950/30" : ""}">
                  <td class="py-2.5 pl-2.5 pr-1 font-semibold text-white truncate">
                    <span class="text-slate-400 mr-1">${idx + 1}.</span>${r.user}
                    ${r.isWinner ? `<span class="ml-1 text-[10px] text-amber-300 font-bold">+5</span>` : ""}
                    ${r.isTiedBonus ? `<span class="ml-1 text-[10px] text-amber-300 font-bold">+3</span>` : ""}
                  </td>
                  <td class="py-2.5 px-1 text-center font-extrabold text-emerald-400">${r.pts}</td>
                  <td class="py-2.5 pl-1 pr-2.5 text-center text-slate-200">${r.exactos}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderJornadaResultsSubTab() {
      const roundMatches = state.matches.filter(m => m.jornada === state.currentJornada);
      const list = roundMatches.length ? roundMatches : FALLBACK_MATCHES;

      return `
        <div class="space-y-2.5">
          ${list.map(m => `
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between text-xs font-bold text-white">
                <span class="truncate">${m.home} vs ${m.away}</span>
                <span class="shrink-0 ml-2 px-2 py-0.5 rounded bg-slate-950 text-emerald-400">
                  ${(m.homeGoals !== null && m.awayGoals !== null) ? `${m.homeGoals}-${m.awayGoals}` : "Pendiente"}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
                ${state.users.map(u => {
                  const p = state.predictions[`${u.name}_${m.id}`];
                  const hasPred = p && p.h !== null && p.a !== null;
                  const pts = hasPred ? scoreMatch(p.h, p.a, m.homeGoals, m.awayGoals).pts : 0;
                  return `
                    <div class="flex items-center justify-between text-[11px] bg-slate-950/90 border border-slate-800/80 rounded-lg px-2 py-1.5">
                      <span class="text-slate-200 truncate">${u.name}: <b>${hasPred ? `${p.h}-${p.a}` : "-"}</b></span>
                      <span class="text-emerald-400 font-bold ml-1 shrink-0">+${pts}</span>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderHistoryTab() {
      return `
        <div class="space-y-3">
          ${state.pastRounds.map(pr => `
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
              <div class="px-3 py-2.5 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-bold text-white">Jornada ${pr.jornada}</h3>
                <span class="text-[11px] text-amber-300 font-semibold">Bonificación aplicada</span>
              </div>
              <table class="w-full table-fixed text-left border-collapse">
                <thead>
                  <tr class="bg-slate-950 text-[11px] text-slate-400 border-b border-slate-800">
                    <th class="py-2 pl-2.5 pr-1 w-[46%]">Jugador</th>
                    <th class="py-2 px-1 text-center w-[27%]">Pts J.</th>
                    <th class="py-2 pl-1 pr-2.5 text-center w-[27%]">Exactos J.</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70 text-xs">
                  ${pr.rows.map((r, i) => `
                    <tr>
                      <td class="py-2.5 pl-2.5 pr-1 font-semibold text-white truncate">
                        <span class="text-slate-400 mr-1">${i + 1}.</span>${r.user}
                      </td>
                      <td class="py-2.5 px-1 text-center font-extrabold text-emerald-400">${r.pts}</td>
                      <td class="py-2.5 pl-1 pr-2.5 text-center text-slate-200">${r.exactos}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderRulesTab() {
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-3 text-xs text-slate-200 leading-relaxed">
          <h2 class="text-sm font-bold text-white">Reglas del Juego</h2>
          <div class="space-y-1.5">
            <div class="font-bold text-emerald-400">1. Puntuación por partido</div>
            <p>• <b>4 puntos</b> por acertar el resultado exacto.</p>
            <p>• <b>2 puntos</b> por acertar el signo (1, X, 2), más <b>+1 punto adicional</b> si aciertas la diferencia de goles.</p>
            <p>• <b>0 puntos</b> si fallas el signo.</p>
          </div>
          <div class="space-y-1.5">
            <div class="font-bold text-emerald-400">2. Ganador de jornada</div>
            <p>• <b>+5 puntos extra</b> en la clasificación general para el ganador de la jornada.</p>
            <p>• En caso de empate a puntos en la jornada, gana quien tenga <b>más resultados exactos</b>. Si persiste el empate, se otorgan <b>+3 puntos a cada uno</b>.</p>
          </div>
          <div class="space-y-1.5">
            <div class="font-bold text-emerald-400">3. Clasificación general</div>
            <p>• Se ordena por: <b>1º Puntos totales</b>, <b>2º Jornadas ganadas</b> y <b>3º Resultados exactos</b>.</p>
          </div>
          <div class="space-y-1.5">
            <div class="font-bold text-emerald-400">4. Bloqueo y nuevos registros</div>
            <p>• Al empezar el primer partido de la jornada se bloquea la edición y se muestran los pronósticos de todos.</p>
            <p>• Cada usuario nuevo entra con la misma puntuación que el último clasificado.</p>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      root.innerHTML = `
        ${state.screen === "auth" ? renderAuthScreen() : renderHomeScreen()}
        ${state.toast ? `
          <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-semibold border border-emerald-500/40 shadow-xl text-center">
            ${state.toast}
          </div>
        ` : ""}
      `;
      bindEvents();
    }

    function bindEvents() {
      const goReg = document.getElementById("btn-go-register");
      if (goReg) goReg.onclick = () => { state.authMode = "register"; render(); };

      const goLog = document.getElementById("btn-go-login");
      if (goLog) goLog.onclick = () => { state.authMode = "login"; render(); };

      const backAuth = document.getElementById("btn-back-auth");
      if (backAuth) backAuth.onclick = () => { state.authMode = null; render(); };

      const submitAuth = document.getElementById("btn-submit-auth");
      if (submitAuth) {
        submitAuth.onclick = () => {
          const n = document.getElementById("auth-name")?.value || "";
          const p = document.getElementById("auth-pin")?.value || "";
          if (state.authMode === "register") handleRegister(n, p);
          else handleLogin(n, p);
        };
      }

      const logoutBtn = document.getElementById("btn-logout");
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          state.currentUser = null;
          state.authMode = null;
          state.screen = "auth";
          render();
        };
      }

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
          state.activeTab = btn.dataset.tab;
          render();
        };
      });

      document.querySelectorAll(".subtab-btn").forEach(btn => {
        btn.onclick = () => {
          state.currentSubTab = btn.dataset.subtab;
          render();
        };
      });

      const savePredsBtn = document.getElementById("btn-save-preds");
      if (savePredsBtn) {
        savePredsBtn.onclick = () => {
          const roundMatches = state.matches.filter(m => m.jornada === state.nextJornada);
          savePredictions(roundMatches.length ? roundMatches : FALLBACK_MATCHES);
        };
      }
    }

    render();
    subscribeFirestore();
    loadMatchesFromApi();
  </script>
</body>
</html>
